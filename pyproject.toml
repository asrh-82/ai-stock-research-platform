[project]
name = "ai-stock-research-platform"
version = "0.1.0"
description = "A Streamlit-based equity research platform with company analysis, watchlists, peer comparison, and valuation tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.59,<5",
    "lxml>=5.3,<7",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pypdf>=5.5,<7",
    "requests>=2.32,<3",
    "streamlit>=1.58.0",
    "yfinance>=1.4.1",
]
