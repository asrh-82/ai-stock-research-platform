name: Workspace evidence
on:
  push:
    branches: [feature/phase-11-stock-selection-workspace]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application and tests
        run: python -m pip install -r requirements.txt pytest playwright
      - name: Compile and test
        run: |
          mkdir -p artifacts
          python -m compileall -q app.py Utils pages tests scripts
          python -m pytest tests -q --junitxml=artifacts/tests.xml
      - name: Current-data scanner smoke (not trading evidence)
        id: provider
        continue-on-error: true
        run: python scripts/selection_live_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification browsers
        run: |
          npm install --global agent-browser
          agent-browser install --with-deps
          python -m playwright install --with-deps chromium
      - name: Browser workflow and persistence
        run: bash scripts/workspace_browser.sh
      - name: Package source and summarize
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD > artifacts/source.zip
          echo 'Provider probe outcome: ${{ steps.provider.outcome }}. Inspect selection_provider.json; test success is not market evidence.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Browser target: CI-local server, not the protected Vercel preview.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-evidence
          path: artifacts/
          retention-days: 7
