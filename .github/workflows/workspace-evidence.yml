name: Workspace evidence
on:
  push:
    branches: [feature/phase-11-stock-selection-workspace]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application and tests
        run: python -m pip install -r requirements.txt pytest
      - name: Compile and test
        run: |
          mkdir -p artifacts
          python -m compileall -q app.py Utils pages tests scripts
          python -m pytest tests -q --junitxml=artifacts/tests.xml
      - name: Package source for offline review
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD > artifacts/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-evidence
          path: artifacts/
          retention-days: 7
