name: Opportunity evidence
on:
  pull_request:
    paths:
      - 'Utils/opportunit*.py'
      - 'scripts/run_opportunity_evidence.py'
      - '.github/workflows/opportunity-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install data and numerical dependencies
        run: python -m pip install numpy pandas yfinance
      - name: Run actual opportunity engine on the fixed three-asset universe
        run: python scripts/run_opportunity_evidence.py
      - name: Preserve exact run evidence including blocked assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-evidence
          path: opportunity_evidence/
          retention-days: 30
          if-no-files-found: error
